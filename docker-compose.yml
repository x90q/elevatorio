services:
  postgres:
    image: postgres:16-alpine
    container_name: elevator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: elevator_dev
      POSTGRES_USER: elevator_user
      POSTGRES_PASSWORD: elevator_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: